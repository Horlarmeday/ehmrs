<!DOCTYPE html>
<html>
<head>
    <title>Test Categories Frontend</title>
    <script>
        // Test script to verify categories functionality
        async function testCategoriesFlow() {
            console.log('🔐 Testing login and categories flow...');
            
            try {
                // Step 1: Login
                const loginResponse = await fetch('http://localhost:4050/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: '123456'
                    })
                });
                
                if (!loginResponse.ok) {
                    throw new Error(`Login failed: ${loginResponse.status}`);
                }
                
                const loginData = await loginResponse.json();
                console.log('✅ Login successful:', loginData);
                
                if (!loginData.token) {
                    throw new Error('No token received');
                }
                
                // Step 2: Test categories API
                const categoriesResponse = await fetch('http://localhost:4050/api/general-store/categories', {
                    headers: {
                        'Authorization': `Bearer ${loginData.token}`
                    }
                });
                
                if (!categoriesResponse.ok) {
                    throw new Error(`Categories API failed: ${categoriesResponse.status}`);
                }
                
                const categoriesData = await categoriesResponse.json();
                console.log('✅ Categories API successful:', categoriesData);
                
                // Step 3: Test frontend proxy
                try {
                    const proxyResponse = await fetch('http://localhost:8081/api/general-store/categories', {
                        headers: {
                            'Authorization': `Bearer ${loginData.token}`
                        }
                    });
                    
                    if (proxyResponse.ok) {
                        const proxyData = await proxyResponse.json();
                        console.log('✅ Frontend proxy successful:', proxyData);
                    } else {
                        console.log('❌ Frontend proxy failed:', proxyResponse.status);
                    }
                } catch (proxyError) {
                    console.log('❌ Frontend proxy error:', proxyError.message);
                }
                
                // Step 4: Store token in localStorage for frontend testing
                localStorage.setItem('token', loginData.token);
                console.log('💾 Token stored in localStorage for frontend testing');
                
                // Step 5: Navigate to categories page
                console.log('🌐 Navigate to: http://localhost:8081/#/general-store/categories');
                window.open('http://localhost:8081/#/general-store/categories', '_blank');
                
            } catch (error) {
                console.error('❌ Test failed:', error);
            }
        }
        
        // Auto-run test when page loads
        window.onload = function() {
            testCategoriesFlow();
        };
    </script>
</head>
<body>
    <h1>Testing Categories Frontend Flow</h1>
    <p>Check the browser console for test results.</p>
    <button onclick="testCategoriesFlow()">Run Test Again</button>
</body>
</html>
